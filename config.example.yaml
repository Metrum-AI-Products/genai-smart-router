users:
# Account identities are explicit and stable. Caller keys reference user ids
# with owner_user; legacy callers[].user is still accepted as a deprecated alias.
# User, project, and membership statuses support active, disabled, suspended,
# removed, and archived. Caller key statuses also support expired and rotated.
- id: standard
  name: Standard API Caller
  type: service_account
  status: active
- id: coding
  name: Coding Agent API Caller
  type: service_account
  status: active
- id: metrics-admin
  name: Metrics Admin API Caller
  type: service_account
  status: active
- id: content-admin
  name: Content Capture Admin API Caller
  type: service_account
  status: active
projects:
- id: metrum-insights
  name: Metrum Insights
  status: active
- id: observability
  name: Observability
  status: active
- id: compliance
  name: Compliance
  status: active
project_memberships:
- user_id: standard
  project: metrum-insights
  role: developer
  status: active
- user_id: coding
  project: metrum-insights
  role: developer
  status: active
- user_id: metrics-admin
  project: observability
  role: operator
  status: active
- user_id: content-admin
  project: compliance
  role: operator
  status: active
callers:
# Each caller id, token_sha256, and non-empty token_id must be unique. Token
# hashes are compared case-insensitively, and duplicate-hash validation errors
# name the caller ids without printing the hash value.
- id: standard-dev
  owner_user: standard
  project: metrum-insights
  environment: dev
  status: active
  token_sha256: REPLACE_WITH_SHA256_HEX_OF_STANDARD_ROUTER_TOKEN
  token_id: rtr_metrum_standard_metrum-insights_dev_kreplace
  metrics_admin: false
  content_admin: false
  allow:
  - default
  - fast
  - small
  - vision
  - external-policy-demo
  rate:
    rpm: 120
    tpm: 200000
    concurrent: 8
  quota:
    day:
      requests: 5000
      tokens: 20000000
    month:
      requests: 0
      tokens: 400000000
    soft_pct: 80
  key:
    lifetime_tokens: 2000000000
    soft_pct: 90
    on_exhaust: disable
