server:
  listen: :8080
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
  upstream:
    timeout_ms: 600000
    default_attempt_timeout_ms: 0
  diagnostics:
    enabled: true
    retention_days: 30
    store_sanitized_upstream_errors: false
    max_error_bytes: 2048
state_path: router-state.json
providers:
  kimi:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
        input_price_per_million_usd: 0.74
        output_price_per_million_usd: 3.5
        pricing_source: https://platform.kimi.ai/docs/pricing/chat-k27-code
        pricing_updated_at: '2026-06-17'
  xai:
    base_url: https://api.x.ai/v1
    dialect: openai-chat
    api_key: ${XAI_API_KEY}
    api_key_env: XAI_API_KEY
    key_id: xai-default
    models:
      grok-4-3:
        model: grok-4.3
        tier: heavy
        input_price_per_million_usd: 1.25
        output_price_per_million_usd: 2.5
        image_input_price_per_million_tokens_usd: 1.25
        input_modalities:
        - text
        - image
        output_modalities:
        - text
        pricing_source: https://docs.x.ai/developers/models/grok-4.3
        pricing_updated_at: '2026-06-17'
        pricing_notes: catalog-only until a valid XAI_API_KEY passes direct text and image smokes
        tool_support:
          openai_chat:
          - tools
          - structured_outputs
  baseten:
    base_url: https://inference.baseten.co/v1
    dialect: openai-chat
    api_key: ${BASETEN_API_KEY}
    api_key_env: BASETEN_API_KEY
    key_id: baseten-default
    models:
      nemotron-120b-a12b:
        model: nvidia/Nemotron-120B-A12B
        tier: heavy
        input_price_per_million_usd: 0.3
        output_price_per_million_usd: 0.75
        input_modalities:
        - text
        output_modalities:
        - text
        pricing_source: https://www.baseten.co/pricing/
        pricing_updated_at: '2026-06-17'
        pricing_notes: Baseten pricing page also lists $0.06/M cache input for NVIDIA Nemotron 3 Super; router usage rows currently log standard input/output token rates plus any upstream-reported billed cost.
        tool_support:
          openai_chat:
          - tools
          - tool_choice
  minimax:
    base_url: https://api.minimax.io/v1
    dialect: openai-chat
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
        input_price_per_million_usd: 0.3
        output_price_per_million_usd: 1.2
        input_modalities:
        - text
        - image
        - video
        output_modalities:
        - text
        pricing_source: https://platform.minimax.io/docs/pricing/overview
        pricing_updated_at: '2026-06-17'
        tool_support:
          openai_chat:
          - tools
          - tool_choice
          openai_responses:
          - function
  openrouter:
    base_url: https://openrouter.ai/api/v1
    dialect: openai-chat
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-default
    models:
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
        input_price_per_million_usd: 0.09
        output_price_per_million_usd: 0.18
        pricing_source: https://openrouter.ai/api/v1/models
        pricing_updated_at: '2026-06-17'
        tool_support:
          openai_chat:
          - tools
          - tool_choice
          - structured_outputs
      gemma-4-26b-a4b-it-nitro:
