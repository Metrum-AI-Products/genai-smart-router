server:
  listen: :8080
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
state_path: router-state.json
providers:
  anthropic:
    base_url: https://api.anthropic.com
    dialect: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    api_key_env: ANTHROPIC_API_KEY
    key_id: anthropic-default
    models:
      opus:
        model: claude-opus-4-8
        tier: heavy
  moonshot:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
      kimi-k2:
        model: kimi-k2
        tier: cheap
  kimi:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${KIMI_API_KEY}
    api_key_env: KIMI_API_KEY
    key_id: kimi-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
      kimi-k2:
        model: kimi-k2
        tier: cheap
  qwen:
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    dialect: openai-chat
    api_key: ${QWEN_API_KEY}
    api_key_env: QWEN_API_KEY
    key_id: qwen-default
    models:
      qwen3-max:
        model: qwen3-max
        tier: cheap
  minimax:
    base_url: https://api.minimax.io/v1
    dialect: openai-chat
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
      m27-highspeed:
        model: MiniMax-M2.7-highspeed
        tier: balanced
  openrouter:
    base_url: https://openrouter.ai/api/v1
    dialect: openai-chat
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-default
    models:
      pareto-code-nitro:
        model: openrouter/pareto-code:nitro
        tier: heavy
      kimi-k27-code-nitro:
        model: moonshotai/kimi-k2.7-code:nitro
        tier: heavy
      minimax-m3-nitro:
        model: minimax/minimax-m3:nitro
        tier: heavy
      qwen37-max-nitro:
        model: qwen/qwen3.7-max:nitro
        tier: balanced
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
      glm51-nitro:
        model: z-ai/glm-5.1:nitro
        tier: balanced
      qwen36-flash-nitro:
        model: qwen/qwen3.6-flash:nitro
        tier: cheap
      hy3-preview-nitro:
        model: tencent/hy3-preview:nitro
        tier: balanced
      kat-coder-pro-v2-nitro:
        model: kwaipilot/kat-coder-pro-v2:nitro
        tier: balanced
      nemotron-3-nano-30b-a3b:
        model: nvidia/nemotron-3-nano-30b-a3b
        tier: cheap
      mercury-2:
        model: inception/mercury-2
        tier: balanced
      ling-26-flash:
        model: inclusionai/ling-2.6-flash
        tier: balanced
  openrouter_anthropic:
    base_url: https://openrouter.ai/api
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-anthropic-default
    models:
      claude-sonnet-46:
        model: anthropic/claude-sonnet-4.6
        tier: heavy
      claude-sonnet-46-nitro:
        model: anthropic/claude-sonnet-4.6:nitro
        tier: heavy
  xai:
    base_url: https://api.x.ai/v1
    dialect: openai-chat
    api_key: ${XAI_API_KEY}
    api_key_env: XAI_API_KEY
    key_id: xai-default
    models:
      grok-3:
        model: grok-3
        tier: heavy
  groq:
    base_url: https://api.groq.com/openai/v1
    dialect: openai-chat
    api_key: ${GROQ_API_KEY}
    api_key_env: GROQ_API_KEY
    key_id: groq-default
    models:
      compound-mini:
        model: groq/compound-mini
        tier: cheap
      llama-31-8b-instant:
        model: llama-3.1-8b-instant
        tier: cheap
      qwen3-32b:
        model: qwen/qwen3-32b
        tier: balanced
      llama-33-70b:
        model: llama-3.3-70b-versatile
        tier: heavy
  replicate:
    base_url: https://api.replicate.com
    dialect: replicate
    api_key: ${REPLICATE_API_KEY}
    api_key_env: REPLICATE_API_KEY
    key_id: replicate-default
    models:
      llama-3-70b:
        model: meta/meta-llama-3-70b-instruct
        tier: cheap
  openai:
    base_url: https://api.openai.com/v1
    dialect: openai-responses
    api_key: ${OPENAI_API_KEY}
    api_key_env: OPENAI_API_KEY
    key_id: openai-default
    models:
      gpt54-nano:
        model: gpt-5.4-nano
        tier: cheap
      gpt54-mini:
        model: gpt-5.4-mini
        tier: balanced
      gpt54:
        model: gpt-5.4
        tier: heavy
      gpt55:
        model: gpt-5.5
        tier: heavy
      gpt55-pro:
        model: gpt-5.5-pro
        tier: heavy
