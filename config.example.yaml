server:
  listen: :8080
  default_model_group: default
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
  # Offline signed JSON license enforcement. Normal builds always enforce a
  # Metrum-issued license.json; runtime config cannot disable licensing.
  # Internal developers who need temporary no-license local testing must build
  # with the internal dev_no_license tag instead of changing YAML.
  license:
    enabled: true
    path: /app/config/license.json
    state_path: /app/state/license-state.json
    # Set when Metrum issues an instance-bound license for this deployment.
    instance_fingerprint: ""
    recheck_interval: 1h
    grace_period_on_validation_error: 24h
    fail_open_for_dev: false
  # Optional normalized routing-decision telemetry. Disabled by default.
  # When enabled, the router writes safe scalar child rows keyed by request_id
  # for request shape features, target candidates, target filter reason buckets,
  # selected routing decisions, routing signals, score/ranking terms, policy
  # executions, fallback transitions, cache hit/miss/bypass reason buckets, and
  # non-secret routing fingerprints on request usage rows.
  decision_telemetry:
    enabled: false
    max_candidates: 64
    max_filter_reasons: 256
    record_candidates: true
    record_cache_reasons: true
  upstream:
    timeout_ms: 600000
    default_attempt_timeout_ms: 0
  diagnostics:
    enabled: true
    retention_days: 30
    store_sanitized_upstream_errors: false
    max_error_bytes: 2048
  # Browser-admin HTTP Basic authentication is disabled by default. It only
  # establishes an admin subject; control-plane authorization uses explicit
  # Casbin grants under server.admin_auth.authorization.
  admin_auth:
    basic:
      enabled: false
      realm: GenAI Smart Router Admin
      allow_insecure_http: false
      trusted_proxy_cidrs: []
      users: []
      # Example enabling shape, using a deployment secret for the bcrypt hash:
      # users:
      # - username: admin
      #   password_hash_env: SMART_ROUTER_ADMIN_PASSWORD_HASH
      #   subject: basic:admin
      #   domain: example/prod
      #   permissions:
      #   - admin:auth:read
    oidc:
      enabled: false
      issuer_url: https://accounts.google.com
      client_id_env: GOOGLE_OIDC_CLIENT_ID
      client_secret_env: GOOGLE_OIDC_CLIENT_SECRET
      redirect_url: https://router.example.com/admin/auth/callback
      scopes:
      - email
      - profile
      allowed_domains:
      - example.com
      groups_claim: groups
      email_claim: email
      subject_claim: email
      domain: example/prod
    sessions:
      cookie_name: smart_router_admin_session
      ttl: 8h
      secure_cookies: true
      same_site: strict
    authorization:
      enabled: false
      # source: static loads deployment-owned policy_file and inline policy.
      # source: db loads the single active policy set from the usage DB and
      # fails closed at startup if no active validated policy set exists.
      source: static
      policy_file: ''
      policy: []
      # Example Casbin policy for metrics, admin reports, and content maintenance after AuthN is enabled.
      # Use policy_file for deployment-owned CSV files, or inline policy for small installs.
      # For DB-backed policy lifecycle, create policy rows in the usage DB, validate
      # and activate them through admin-safe tooling, then set source: db.
      # policy:
      # - g, caller:ops-metrics-key, metrics_admin, example/prod
      # - g, caller:content-admin-key, content_admin, example/prod
      # - g, basic:admin, reports_admin, example/prod
      # - g, user:alice@example.com, reports_admin, example/prod
      # - p, metrics_admin, example/prod, metrics, read
      # - p, content_admin, example/prod, content:capture, delete|purge
      # - p, reports_admin, example/prod, admin:reports, read|export|drilldown
      # - p, reports_admin, example/prod, admin:security_reports, read|export
  admin_reports:
    enabled: false
    path_prefix: /admin/reports
    default_since: 24h
    max_range: 31d
    max_rows: 500
    export_markdown: true
    baselines:
      - id: gpt-5.5
        name: GPT-5.5
        input_price_per_million_usd: 5.00
        output_price_per_million_usd: 30.00
        pricing_source: https://developers.openai.com/api/docs/pricing
        pricing_updated_at: "2026-06-25"
        notes: OpenAI API standard text token pricing checked on 2026-06-25.
      - id: claude-opus-4.8
        name: Claude Opus 4.8
        input_price_per_million_usd: 5.00
        output_price_per_million_usd: 25.00
        pricing_source: https://docs.anthropic.com/en/docs/about-claude/pricing
        pricing_updated_at: "2026-06-25"
        notes: Anthropic Claude API standard token pricing checked on 2026-06-25; fast mode and batch pricing are separate.
    security:
      enabled: false
      retention_days: 90
  client_ip:
    trusted_proxy_cidrs: []
    header_order:
      - X-Forwarded-For
      - X-Real-IP
    store_ip: true
  # Governed content capture is disabled by default. Enabling it stores redacted
  # request/response/upstream-error content in separate relational tables keyed
  # by request_id. It is not diagnostics, metrics, or usage reporting.
  content_capture:
    enabled: false
    retention_days: 30
    capture_request: false
    capture_response: false
    capture_tool_calls: false
    capture_images: false
    capture_upstream_errors: false
    capture_headers_allowlist: []
    redact_before_storage: true
    redaction_patterns: []
    max_capture_bytes: 65536
    encryption:
      enabled: false
      kms_key_id: ""
  # Commercial retention foundation. Defaults are conservative and dry-run.
  # When dry_run is false, the CLI deletes at most one configured batch for
  # usage_diagnostics and usage_detail only; usage_detail remains blocked until
  # finalized daily rollups cover the candidate window.
  retention:
    enabled: false
    dry_run: true
    default_batch_size: 500
    classes:
      - data_class: usage_diagnostics
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: decision_telemetry
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: security_access_events
        enabled: true
        retention_days: 90
        batch_size: 500
      - data_class: content_capture
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: usage_detail
        enabled: false
        retention_days: 365
        batch_size: 500
        require_finalized_rollup: true
state_path: router-state.json
