    - provider: minimax
      model_ref: m27-highspeed
      weight: 1
    - provider: kimi
      model_ref: kimi-k2.7-code
      weight: 1
    - provider: minimax
      model_ref: m3
      dialect: openai-responses
      tool_only: true
    - provider: minimax_anthropic
      model_ref: m3
      tool_only: true
    - provider: kimi_anthropic
      model_ref: kimi-k2.7-code
      tool_only: true
