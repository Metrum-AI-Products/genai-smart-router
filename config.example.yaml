server:
  listen: :8080
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
state_path: router-state.json
providers:
  kimi:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
  minimax:
    base_url: https://api.minimax.io/v1
    dialect: openai-chat
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
  openrouter:
    base_url: https://openrouter.ai/api/v1
    dialect: openai-chat
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-default
    models:
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
      gemma-4-26b-a4b-it-nitro:
        model: google/gemma-4-26b-a4b-it:nitro
        tier: balanced
  openai:
    base_url: https://api.openai.com/v1
    dialect: openai-responses
    api_key: ${OPENAI_API_KEY}
    api_key_env: OPENAI_API_KEY
    key_id: openai-default
    models:
      gpt-5.5:
        model: gpt-5.5
        tier: heavy
  anthropic:
    base_url: https://api.anthropic.com
    dialect: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    api_key_env: ANTHROPIC_API_KEY
    key_id: anthropic-default
    models:
      sonnet-4.6:
        model: claude-sonnet-4-6
        tier: heavy
  minimax_anthropic:
    base_url: https://api.minimax.io/anthropic
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-anthropic-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
  kimi_anthropic:
    base_url: https://api.moonshot.ai/anthropic
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-anthropic-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
  openrouter_responses:
    base_url: https://openrouter.ai/api/v1
    dialect: openai-responses
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-responses-default
    models:
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
  openrouter_anthropic:
    base_url: https://openrouter.ai/api
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-anthropic-default
    models:
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
      gemma-4-26b-a4b-it-nitro:
        model: google/gemma-4-26b-a4b-it:nitro
        tier: balanced
models:
  default:
    strategy: weighted
    targets:
    - provider: openrouter
      model_ref: deepseek-v4-flash-nitro
      weight: 56
    - provider: minimax
      model_ref: m3
      weight: 28
    - provider: openrouter
      model_ref: gemma-4-26b-a4b-it-nitro
      weight: 8
    - provider: kimi
      model_ref: kimi-k2.7-code
      weight: 7
    - provider: openai
      model_ref: gpt-5.5
      weight: 1
    - provider: minimax
      model_ref: m3
      weight: 5
      dialect: openai-responses
      tool_only: true
    - provider: openrouter_responses
      model_ref: deepseek-v4-flash-nitro
      weight: 5
      tool_only: true
    - provider: kimi_anthropic
      model_ref: kimi-k2.7-code
      weight: 4
      tool_only: true
      default_thinking:
        type: enabled
        budget_tokens: 512
    - provider: minimax_anthropic
