server:
  listen: :8080
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
state_path: router-state.json
providers:
  kimi:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
      kimi-k2:
        model: kimi-k2
        tier: cheap
  minimax:
    base_url: https://api.minimax.io/v1
    dialect: openai-chat
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
      m27-highspeed:
        model: MiniMax-M2.7-highspeed
        tier: balanced
  openrouter:
    base_url: https://openrouter.ai/api/v1
    dialect: openai-chat
    api_key: ${OPENROUTER_API_KEY}
    api_key_env: OPENROUTER_API_KEY
    key_id: openrouter-default
    models:
      pareto-code-nitro:
        model: openrouter/pareto-code:nitro
        tier: heavy
      kimi-k27-code-nitro:
        model: moonshotai/kimi-k2.7-code:nitro
        tier: heavy
      minimax-m3-nitro:
        model: minimax/minimax-m3:nitro
        tier: heavy
      qwen37-max-nitro:
        model: qwen/qwen3.7-max:nitro
        tier: balanced
      deepseek-v4-flash-nitro:
        model: deepseek/deepseek-v4-flash:nitro
        tier: balanced
      glm51-nitro:
        model: z-ai/glm-5.1:nitro
        tier: balanced
      qwen36-flash-nitro:
        model: qwen/qwen3.6-flash:nitro
        tier: cheap
      hy3-preview-nitro:
        model: tencent/hy3-preview:nitro
        tier: balanced
      kat-coder-pro-v2-nitro:
        model: kwaipilot/kat-coder-pro-v2:nitro
        tier: balanced
      nemotron-3-nano-30b-a3b:
        model: nvidia/nemotron-3-nano-30b-a3b
        tier: cheap
      mercury-2:
        model: inception/mercury-2
        tier: balanced
      ling-26-flash:
        model: inclusionai/ling-2.6-flash
        tier: balanced
  minimax_anthropic:
    base_url: https://api.minimax.io/anthropic
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${MINIMAX_API_KEY}
    api_key_env: MINIMAX_API_KEY
    key_id: minimax-anthropic-default
    models:
      m3:
        model: MiniMax-M3
        tier: heavy
  kimi_anthropic:
    base_url: https://api.moonshot.ai/anthropic
    dialect: anthropic
    auth_scheme: bearer
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-anthropic-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
models:
  default:
    strategy: weighted
    targets:
    - provider: minimax
      model_ref: m3
      weight: 48
    - provider: openrouter
      model_ref: deepseek-v4-flash-nitro
      weight: 96
    - provider: openrouter
      model_ref: qwen36-flash-nitro
      weight: 2
    - provider: openrouter
      model_ref: kat-coder-pro-v2-nitro
