name: Learned routing policy
on:
  pull_request:
    paths:
      - 'services/learned-routing-policy/**'
      - 'scripts/run_lrp_*.py'
      - 'internal/router/**'
      - 'Makefile'
      - '.github/workflows/lrp.yml'
  push:
    branches: [main]
    paths:
      - 'services/learned-routing-policy/**'
      - 'scripts/run_lrp_*.py'
      - '.github/workflows/lrp.yml'
permissions:
  contents: read
concurrency:
  group: lrp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --project services/learned-routing-policy --locked
      - run: make lrp-test lrp-synthetic-demo lrp-e2e
      - run: go test ./internal/router -run 'ExternalRoutingPolicy|Config'
      - run: python3 scripts/check_env_example_secrets.py
