name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v1.3.1)"
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            internal/router/admindist/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build packages
        run: |
          export VERSION="${{ steps.version.outputs.tag }}"
          make package package-docker
      - name: Inventory and checksums
        run: |
          python3 scripts/release_artifact_inventory.py \
            --dist-dir dist \
            --version "${{ steps.version.outputs.tag }}" \
            --commit "$(git rev-parse HEAD)" \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd dist && find . -type f ! -name '*.sha256' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrum-router-${{ steps.version.outputs.tag }}
          path: |
            dist/**
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" dist/* --clobber
