name: EKS staging contract

on:
  pull_request:
    paths:
      - .github/workflows/eks-staging-contract.yml
      - Makefile
      - scripts/makefile_security_test.py
      - scripts/eks_delivery.py
      - scripts/eks_delivery_contract_test.py
      - scripts/validate_staging_supply_chain.py
      - scripts/validate_staging_supply_chain_test.py
      - scripts/validate_eks_staging_workflow.py
      - scripts/validate_eks_staging_workflow_test.py
      - deploy/aws/github-oidc-staging-role-trust-policy.example.json
      - deploy/aws/genai-smart-router-eks-staging-target.json
      - deploy/kubernetes/base/**
      - deploy/kubernetes/overlays/metrum-staging/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/eks-staging-contract.yml
      - Makefile
      - scripts/makefile_security_test.py
      - scripts/eks_delivery.py
      - scripts/eks_delivery_contract_test.py
      - scripts/validate_staging_supply_chain.py
      - scripts/validate_staging_supply_chain_test.py
      - scripts/validate_eks_staging_workflow.py
      - scripts/validate_eks_staging_workflow_test.py
      - deploy/aws/github-oidc-staging-role-trust-policy.example.json
      - deploy/aws/genai-smart-router-eks-staging-target.json
      - deploy/kubernetes/base/**
      - deploy/kubernetes/overlays/metrum-staging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify EKS staging delivery contract
        run: make ci-eks-staging-contract

# Deployment is intentionally not performed here. The protected `staging`
# environment release workflow, added only after #516 supplies its approved
# OIDC role and #517's build/sign/scan producers exist, must invoke the Make
# targets in this order: eks-supply-chain-validate, eks-preflight, eks-plan,
# eks-apply-staging, eks-rollout-status, eks-smoke-staging. It must not embed
# aws, kubectl, or kustomize deployment commands.
