<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metrum Smart Router Admin Reports</title>
  <link rel="stylesheet" href="static/admin.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="static/metrum_logo_white_new.png" alt="Metrum AI">
        <div>
          <p class="eyebrow">GenAI Smart Router</p>
          <h1>Admin Reports</h1>
          <p id="period">Loading report data</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark</button>
        <form id="filters" class="filters">
          <label>Since <input name="since" value="24h" autocomplete="off"></label>
          <label>Caller <input name="caller_id" placeholder="any"></label>
          <label>IP <input name="caller_ip" placeholder="any"></label>
          <label>Project <input name="caller_project" placeholder="any"></label>
          <label>Requested <input name="requested_model" placeholder="any"></label>
          <label>Group <input name="resolved_group" placeholder="any"></label>
          <label>Provider <input name="provider" placeholder="any"></label>
          <label>Target <input name="target_model" placeholder="any"></label>
          <label>Dialect <input name="dialect" placeholder="any"></label>
          <label>Status <input name="status" inputmode="numeric" placeholder="any"></label>
          <label>Cache <input name="cache" placeholder="hit/miss/bypass"></label>
          <label>Client <input name="client" placeholder="any"></label>
          <button type="submit">Apply</button>
          <a id="export" class="button" href="export.md?since=24h">Markdown</a>
        </form>
      </div>
    </header>
    <section id="summary" class="summary"></section>
    <section class="charts">
      <figure><figcaption>Requests</figcaption><canvas id="requestsChart"></canvas></figure>
      <figure><figcaption>Cost</figcaption><canvas id="costChart"></canvas></figure>
      <figure><figcaption>Latency</figcaption><canvas id="latencyChart"></canvas></figure>
      <figure><figcaption>Cache</figcaption><canvas id="cacheChart"></canvas></figure>
      <figure><figcaption>Provider token volume</figcaption><canvas id="providerChart"></canvas></figure>
      <figure><figcaption>Errors And Fallbacks</figcaption><canvas id="errorChart"></canvas></figure>
    </section>
    <nav class="tabs" aria-label="Report sections">
      <button type="button" data-tab="overview">Overview</button>
      <button type="button" data-tab="groups" class="active">Groups</button>
      <button type="button" data-tab="providers">Providers</button>
      <button type="button" data-tab="tokens">Keys</button>
      <button type="button" data-tab="savings">Savings</button>
      <button type="button" data-tab="savings-by-user">Savings by user</button>
      <button type="button" data-tab="savings-by-key">Savings by key</button>
      <button type="button" data-tab="savings-by-group">Savings by group</button>
      <button type="button" data-tab="savings-by-project">Savings by project</button>
      <button type="button" data-tab="savings-by-provider-model">Savings by provider</button>
      <button type="button" data-tab="model-groups-by-user">User groups</button>
      <button type="button" data-tab="usage-by-key">Key usage</button>
      <button type="button" data-tab="usage-by-caller">Caller usage</button>
      <button type="button" data-tab="requested-models">Requested models</button>
      <button type="button" data-tab="provider-model-mix">Provider/model</button>
      <button type="button" data-tab="latency-throughput">Latency</button>
      <button type="button" data-tab="errors-fallbacks">Errors</button>
      <button type="button" data-tab="cache-report">Cache</button>
      <button type="button" data-tab="quotas-budgets">Quotas</button>
      <button type="button" data-tab="troubleshooting-buckets">Troubleshooting</button>
      <button type="button" data-tab="routing-decisions">Routing</button>
      <button type="button" data-tab="provider-catalog-status">Catalog status</button>
      <button type="button" data-tab="retention-status">Retention</button>
      <button type="button" data-tab="contract-buckets">Contracts</button>
      <button type="button" data-tab="contract-workloads">Workloads</button>
      <button type="button" data-tab="target-validation">Validation</button>
      <button type="button" data-tab="expensive-requests">Expensive</button>
      <button type="button" data-tab="client-breakdown">Clients</button>
      <button type="button" data-tab="project-chargeback">Projects</button>
      <button type="button" data-tab="capability-usage">Capabilities</button>
      <button type="button" data-tab="anomalies">Anomalies</button>
      <button type="button" data-tab="security-events">Security</button>
      <button type="button" data-tab="requests">Requests</button>
    </nav>
    <section id="reportTools" class="report-tools">
      <label>Search <input id="tableSearch" autocomplete="off" placeholder="filter visible rows"></label>
      <label>Rows <select id="pageSize"><option>25</option><option selected>50</option><option>100</option></select></label>
      <button id="refreshReport" type="button">Refresh</button>
      <button id="copyLink" type="button">Copy link</button>
      <button id="exportCsv" type="button">CSV</button>
      <span id="refreshState" class="refresh-state"></span>
    </section>
    <section id="savingsPanel" class="savings-panel" hidden>
      <form id="savingsFilters" class="savings-controls">
        <label>Baseline <select name="baseline" id="baselineSelect"></select></label>
        <label>Name <input name="baseline_name" placeholder="Custom baseline"></label>
        <label>Input USD/M <input name="baseline_input_price_per_million_usd" inputmode="decimal" placeholder="5.00"></label>
        <label>Output USD/M <input name="baseline_output_price_per_million_usd" inputmode="decimal" placeholder="30.00"></label>
        <button type="submit">Apply baseline</button>
      </form>
      <section id="savingsSummary" class="summary"></section>
      <section class="charts savings-charts">
        <figure><figcaption>Actual vs baseline cost</figcaption><canvas id="savingsCostChart"></canvas></figure>
        <figure><figcaption>Savings over time</figcaption><canvas id="savingsUsdChart"></canvas></figure>
        <figure><figcaption>Savings rate over time</figcaption><canvas id="savingsPctChart"></canvas></figure>
      </section>
      <div id="savingsWarnings"></div>
    </section>
    <section id="detailPanel" class="detail-panel" hidden></section>
    <section id="tables"></section>
  </main>
  <script src="static/chart.umd.js"></script>
  <script src="static/admin.js"></script>
</body>
</html>
