services:
  router:
    image: smart-llmrouter:${SMART_LLMROUTER_VERSION:?Set SMART_LLMROUTER_VERSION to the packaged image tag, for example 1.2.3-linux-amd64}
    restart: unless-stopped
    command: ["--config", "/app/config/config.yaml"]
    working_dir: /app/state
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
      - ./logs:/app/logs


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - router
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      ROUTER_HOSTNAME: ${ROUTER_HOSTNAME:-router.example.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
