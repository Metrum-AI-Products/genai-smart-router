apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartrouter-commerce
resources:
  - namespace.yaml
  - purchase-deployment.yaml
  - fulfillment-deployment.yaml
  - service.yaml
  # ingress.example.yaml is documentation-only until DNS/TLS are approved.
configMapGenerator:
  - name: commerce-sku-catalog
    files:
      - enterprise-license-skus.json
    options:
      disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: smartrouter-commerce
      app.kubernetes.io/component: commerce
    includeSelectors: false
