# EXAMPLE ONLY — do not apply this file with real keys committed.
# Create the live Secret out-of-band with the exact name the Deployments expect:
#
#   kubectl -n smartrouter-commerce create secret generic commerce-stripe \
#     --from-literal=STRIPE_SECRET_KEY=sk_test_... \
#     --from-literal=STRIPE_PUBLISHABLE_KEY=pk_test_... \
#     --from-literal=STRIPE_WEBHOOK_SECRET=whsec_...
#
# Never put Stripe keys into smartrouter-staging-runtime.
apiVersion: v1
kind: Secret
metadata:
  name: commerce-stripe
  labels:
    app.kubernetes.io/name: smartrouter-commerce
type: Opaque
stringData:
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
