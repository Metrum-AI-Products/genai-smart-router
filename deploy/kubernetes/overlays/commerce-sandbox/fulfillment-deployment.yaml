# Fulfillment worker scaffold: no Stripe secrets, no tenant-namespace RBAC.
# Slice 1 runs optional Fleet bootstrap from the purchase process when
# COMMERCE_FLEET_ENABLED=1. Keep this Deployment at replicas: 0 until a
# shared commerce DB/queue and Fleet refs are wired for a dedicated worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-fulfillment
  labels:
    app.kubernetes.io/name: commerce-fulfillment
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-fulfillment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce-fulfillment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fulfillment
          image: registry.example.com/metrum-genai-commerce:sandbox
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          env:
            - name: COMMERCE_FLEET_ENABLED
              value: "1"
            # Stripe secrets intentionally omitted from fulfillment.
            - name: COMMERCE_FLEET_PROFILE_REF
              value: ""
            - name: COMMERCE_FLEET_LICENSE_REF
              value: ""
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
