# Example Ingress for the public Stripe webhook + checkout API.
# Replace host and TLS secret with staging-appropriate values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce-purchase
  labels:
    app.kubernetes.io/name: commerce-purchase
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: commerce-sandbox.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: commerce-purchase
                port:
                  name: http
