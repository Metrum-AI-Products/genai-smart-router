apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-purchase
  labels:
    app.kubernetes.io/name: commerce-purchase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-purchase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce-purchase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: purchase
          # Replace with the packaged commerce image once published.
          image: registry.example.com/metrum-genai-commerce:sandbox
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8091
            - --catalog=/app/catalog/enterprise-license-skus.json
            - --db=/data/commerce.sqlite
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: commerce-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: commerce-stripe
                  key: STRIPE_WEBHOOK_SECRET
            # Fleet bootstrap stays disabled on the public purchase pod.
            - name: COMMERCE_FLEET_ENABLED
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog
              mountPath: /app/catalog
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: catalog
          configMap:
            name: commerce-sku-catalog
        - name: data
          emptyDir: {}
