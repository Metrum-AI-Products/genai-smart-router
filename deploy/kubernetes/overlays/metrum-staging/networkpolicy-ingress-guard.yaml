# EKS staging applies this guard before the discovery-derived ingress allow
# policy. The generic base intentionally omits an ingress policy for non-EKS
# deployments; do not replace this guard with a fixed ingress namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-llmrouter-restrict-ingress
  labels:
    app.kubernetes.io/name: smart-llmrouter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-llmrouter
  policyTypes:
    - Ingress
  ingress: []
