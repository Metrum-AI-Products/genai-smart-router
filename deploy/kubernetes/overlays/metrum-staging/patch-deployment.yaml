apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-llmrouter
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: router
          image: registry.example.com/smart-llmrouter:replace-with-immutable-image-tag
          env:
            - name: ROUTER_USAGE_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: smartrouter-staging-runtime
                  key: ROUTER_USAGE_DB_DSN
          volumeMounts:
            - $patch: replace
            - name: runtime
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: runtime
              mountPath: /app/config/env.json
              subPath: env.json
              readOnly: true
            - name: runtime
              mountPath: /app/config/license.json
              subPath: license.json
              readOnly: true
            - name: runtime
              mountPath: /app/config/rds-ca.pem
              subPath: rds-ca.pem
              readOnly: true
            - name: runtime
              mountPath: /app/config/scripts/router.ts
              subPath: router.ts
              readOnly: true
            - name: state
              mountPath: /app/state
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - $patch: replace
        - name: runtime
          secret:
            secretName: smartrouter-staging-runtime
            defaultMode: 0400
        - name: state
          persistentVolumeClaim:
            claimName: smart-llmrouter-state
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
