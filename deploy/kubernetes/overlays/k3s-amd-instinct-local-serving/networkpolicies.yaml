apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-vllm-restrict
  namespace: metrum-ai-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: local-serving
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: metrum-ai-router
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # The serving Pods need HTTPS while downloading model weights. Remove this
    # rule after weights are supplied from a deployment-owned local cache.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrum-ai-router-local-vllm-egress
  namespace: metrum-ai-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrum-ai-router
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: local-serving
      ports:
        - protocol: TCP
          port: 8000
