# NVIDIA GPU Operator values for profile nvidia-local-serving (pin v26.7.0).
# Shadeform CUDA images own the NVIDIA driver and toolkit. Keep both disabled
# here so operators do not dual-install drivers when applying the checked-in
# overlay. Blueprint render still regenerates this file from intent:
# driver_owned_by_ami=true => driver/toolkit disabled; false => enabled.
# Live installs must use the blueprint-rendered copy.
driver:
  enabled: false
toolkit:
  enabled: false
devicePlugin:
  enabled: true
# Do not enable DRA and the device plugin for the same device on the same node.
# LMCache / Mooncake are intentionally omitted from this values file.
