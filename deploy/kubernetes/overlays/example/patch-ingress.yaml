apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-llmrouter
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  tls:
    - hosts:
        - llm-api.example.com
      secretName: smart-llmrouter-tls
  rules:
    - host: llm-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-llmrouter
                port:
                  name: http
