# Apply only when Linkerd policy discovery selects an ingress identity. Replace
# the namespace and Kubernetes group with the values configured on the EKS
# access entry. This intentionally permits only the service-account read used
# to prove the selected Linkerd ingress identity exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genai-smart-router-eks-ingress-discovery
  namespace: replace-with-approved-ingress-namespace
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genai-smart-router-eks-ingress-discovery
  namespace: replace-with-approved-ingress-namespace
subjects:
  - kind: Group
    name: replace-with-approved-eks-access-entry-kubernetes-group
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: genai-smart-router-eks-ingress-discovery
