apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: genai-smart-router-eks-staging-delivery
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
  matchConditions:
    - name: delivery-group-only
      expression: "'genai-smart-router-eks-staging-delivery' in request.userInfo.groups"
  validations:
    - expression: >-
        object.metadata.name == 'smart-llmrouter' &&
        object.spec.replicas == 1 &&
        object.spec.strategy.type == 'Recreate' &&
        object.spec.selector.matchLabels == {'app.kubernetes.io/name': 'smart-llmrouter'} &&
        object.spec.template.metadata.labels == {'app.kubernetes.io/name': 'smart-llmrouter'}
      message: The delivery role may mutate only the reviewed staging router Deployment identity.
      reason: Forbidden
    - expression: >-
        has(object.spec.template.metadata.annotations) &&
        object.spec.template.metadata.annotations['linkerd.io/inject'] == 'enabled'
      message: The reviewed staging router must retain Linkerd injection.
      reason: Forbidden
    - expression: >-
        object.spec.template.spec.serviceAccountName == 'smart-llmrouter' &&
        object.spec.template.spec.automountServiceAccountToken == false &&
        (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) &&
        (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) &&
        (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false) &&
        (!has(object.spec.template.spec.shareProcessNamespace) || object.spec.template.spec.shareProcessNamespace == false)
      message: The reviewed staging pod identity and host-isolation boundary must remain unchanged.
      reason: Forbidden
    - expression: >-
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        object.spec.template.spec.securityContext.runAsUser == 65532 &&
        object.spec.template.spec.securityContext.runAsGroup == 65532 &&
        object.spec.template.spec.securityContext.fsGroup == 65532 &&
        object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: The reviewed staging pod security context must remain unchanged.
      reason: Forbidden
    - expression: >-
        object.spec.template.spec.containers.size() == 1 &&
        object.spec.template.spec.containers.exists_one(c,
          c.name == 'router' &&
          c.image == params.data.approved_router_image &&
          !has(c.command) &&
          c.args == ['--config', '/app/config/config.yaml'] &&
          !has(c.envFrom) &&
          c.env.size() == 1 &&
          c.env[0].name == 'ROUTER_USAGE_DB_DSN' &&
          c.env[0].valueFrom.secretKeyRef.name == 'smartrouter-staging-runtime' &&
          c.env[0].valueFrom.secretKeyRef.key == 'ROUTER_USAGE_DB_DSN' &&
          !has(c.lifecycle) &&
          (!has(c.stdin) || c.stdin == false) &&
          (!has(c.tty) || c.tty == false) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          c.securityContext.capabilities.drop == ['ALL'])
      message: The router image, process, environment, and container security contract must match the bootstrap-approved specification.
      reason: Forbidden
    - expression: >-
        object.spec.template.spec.containers[0].volumeMounts.size() == 8 &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/config.yaml' && v.subPath == 'config.yaml' && v.readOnly == true) &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/env.json' && v.subPath == 'env.json' && v.readOnly == true) &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/license.json' && v.subPath == 'license.json' && v.readOnly == true) &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/rds-ca.pem' && v.subPath == 'rds-ca.pem' && v.readOnly == true) &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/scripts/router.ts' && v.subPath == 'router.ts' && v.readOnly == true) &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'state' && v.mountPath == '/app/state') &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'logs' && v.mountPath == '/app/logs') &&
        object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'tmp' && v.mountPath == '/tmp')
      message: The router may mount only the reviewed runtime, state, log, and scratch paths.
      reason: Forbidden
    - expression: >-
        object.spec.template.spec.volumes.size() == 4 &&
        object.spec.template.spec.volumes.exists_one(v, v.name == 'runtime' && v.secret.secretName == 'smartrouter-staging-runtime' && v.secret.defaultMode == 256) &&
        object.spec.template.spec.volumes.exists_one(v, v.name == 'state' && v.persistentVolumeClaim.claimName == 'smart-llmrouter-state') &&
        object.spec.template.spec.volumes.exists_one(v, v.name == 'logs' && has(v.emptyDir)) &&
        object.spec.template.spec.volumes.exists_one(v, v.name == 'tmp' && has(v.emptyDir)) &&
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size() == 0)
      message: The Deployment may use only the reviewed runtime, state, scratch, and router containers before Linkerd injects the Pod.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: genai-smart-router-eks-staging-delivery
spec:
  policyName: genai-smart-router-eks-staging-delivery
  validationActions: [Deny, Audit]
  paramRef:
    name: smartrouter-staging-runtime-attestation
    namespace: smart-llmrouter-staging
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: smart-llmrouter-staging
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: genai-smart-router-eks-staging-linkerd-pod
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  validations:
    - expression: >-
        request.operation == 'CREATE' &&
        request.userInfo.username == params.data.approved_pod_creator_username &&
        object.metadata.labels['app.kubernetes.io/name'] == 'smart-llmrouter' &&
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists_one(ref,
          ref.kind == 'ReplicaSet' &&
          ref.controller == true &&
          ref.name.startsWith('smart-llmrouter-'))
      message: Only the attested ReplicaSet controller may create an admitted router Pod.
      reason: Forbidden
    - expression: >-
        object.spec.serviceAccountName == 'smart-llmrouter' &&
        object.spec.automountServiceAccountToken == false &&
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
        (!has(object.spec.shareProcessNamespace) || object.spec.shareProcessNamespace == false) &&
        object.spec.securityContext.runAsNonRoot == true &&
        object.spec.securityContext.runAsUser == 65532 &&
        object.spec.securityContext.runAsGroup == 65532 &&
        object.spec.securityContext.fsGroup == 65532 &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: The injected router Pod must retain the reviewed identity and host-isolation boundary.
      reason: Forbidden
    - expression: >-
        object.spec.containers.size() == 1 &&
        object.spec.containers.exists_one(c,
          c.name == 'router' &&
          c.image == params.data.approved_router_image &&
          !has(c.command) &&
          c.args == ['--config', '/app/config/config.yaml'] &&
          !has(c.envFrom) &&
          c.env.size() == 1 &&
          c.env[0].name == 'ROUTER_USAGE_DB_DSN' &&
          c.env[0].valueFrom.secretKeyRef.name == 'smartrouter-staging-runtime' &&
          c.env[0].valueFrom.secretKeyRef.key == 'ROUTER_USAGE_DB_DSN' &&
          !has(c.lifecycle) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          c.securityContext.capabilities.drop == ['ALL'] &&
          c.volumeMounts.size() == 8 &&
          c.volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/config.yaml' && v.subPath == 'config.yaml' && v.readOnly == true) &&
          c.volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/env.json' && v.subPath == 'env.json' && v.readOnly == true) &&
          c.volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/license.json' && v.subPath == 'license.json' && v.readOnly == true) &&
          c.volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/rds-ca.pem' && v.subPath == 'rds-ca.pem' && v.readOnly == true) &&
          c.volumeMounts.exists_one(v, v.name == 'runtime' && v.mountPath == '/app/config/scripts/router.ts' && v.subPath == 'router.ts' && v.readOnly == true) &&
          c.volumeMounts.exists_one(v, v.name == 'state' && v.mountPath == '/app/state') &&
          c.volumeMounts.exists_one(v, v.name == 'logs' && v.mountPath == '/app/logs') &&
          c.volumeMounts.exists_one(v, v.name == 'tmp' && v.mountPath == '/tmp'))
      message: The final router Pod must retain its reviewed process, environment, mounts, and container security contract.
      reason: Forbidden
    - expression: >-
        has(object.spec.initContainers) &&
        object.spec.initContainers.exists_one(c,
          c.name == 'linkerd-proxy' &&
          c.restartPolicy == 'Always' &&
          c.image == params.data.approved_linkerd_proxy_image &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          (!has(c.volumeMounts) || c.volumeMounts.all(v, !(v.name in ['runtime', 'state', 'logs', 'tmp'])))) &&
        object.spec.initContainers.all(c, c.name in ['linkerd-proxy', 'linkerd-init']) &&
        (params.data.approved_linkerd_init_image == 'none'
          ? object.spec.initContainers.size() == 1
          : (object.spec.initContainers.size() == 2 &&
             object.spec.initContainers.exists_one(c,
               c.name == 'linkerd-init' &&
               c.image == params.data.approved_linkerd_init_image &&
               c.securityContext.allowPrivilegeEscalation == false &&
               c.securityContext.privileged == false &&
               c.securityContext.readOnlyRootFilesystem == true &&
               c.securityContext.capabilities.add == ['NET_ADMIN', 'NET_RAW'] &&
               (!has(c.volumeMounts) ||
                c.volumeMounts.all(v,
                  v.name.startsWith('linkerd-') &&
                  !(v.name in ['runtime', 'state', 'logs', 'tmp']))))))
      message: Init containers are forbidden except for the bootstrap-approved native Linkerd proxy and optional Linkerd initializer.
      reason: Forbidden
    - expression: >-
        object.spec.volumes.all(v,
          v.name in ['runtime', 'state', 'logs', 'tmp'] ||
          (v.name.startsWith('linkerd-') && (has(v.emptyDir) || has(v.projected))))
      message: The injected Pod may use only reviewed router volumes and Linkerd-injected projected or scratch volumes.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: genai-smart-router-eks-staging-linkerd-pod
spec:
  policyName: genai-smart-router-eks-staging-linkerd-pod
  validationActions: [Deny, Audit]
  paramRef:
    name: smartrouter-staging-runtime-attestation
    namespace: smart-llmrouter-staging
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: smart-llmrouter-staging
    objectSelector:
      matchLabels:
        app.kubernetes.io/name: smart-llmrouter
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
