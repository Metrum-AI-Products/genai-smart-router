# Copy this EKS-only guard into a deployment-owned EKS overlay before exposing
# the router. It denies ingress until the selected-namespace policy is rendered
# from fresh discovery evidence and activated through the explicit EKS target.
# Do not add it to the generic base: non-EKS deployments use their own reviewed
# NetworkPolicy implementation and must keep their configured ingress path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrum-ai-router-restrict-ingress
  labels:
    app.kubernetes.io/name: metrum-ai-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrum-ai-router
  policyTypes:
    - Ingress
  ingress: []
