apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: genai-smart-router-eks-staging-bootstrap-rbac
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "rolebindings"]
        scope: Namespaced
  matchConditions:
    - name: bootstrap-group-only
      expression: "'genai-smart-router-eks-staging-bootstrap' in request.userInfo.groups"
  validations:
    - expression: >-
        object.metadata.namespace == 'smart-llmrouter-staging' &&
        ((request.resource.resource == 'roles' &&
          object.metadata.name == 'genai-smart-router-eks-staging-delivery' &&
          object.metadata.labels == {
            'app.kubernetes.io/name': 'smart-llmrouter',
            'app.kubernetes.io/component': 'delivery-identity'
          } &&
          object.rules.size() == 7 &&
          object.rules[0].apiGroups == [''] && object.rules[0].resources == ['pods'] && object.rules[0].verbs == ['get', 'list', 'watch'] && !has(object.rules[0].resourceNames) && !has(object.rules[0].nonResourceURLs) &&
          object.rules[1].apiGroups == [''] && object.rules[1].resources == ['services', 'serviceaccounts', 'persistentvolumeclaims'] && object.rules[1].verbs == ['get', 'list', 'watch', 'create', 'update', 'patch'] && !has(object.rules[1].resourceNames) && !has(object.rules[1].nonResourceURLs) &&
          object.rules[2].apiGroups == ['apps'] && object.rules[2].resources == ['deployments'] && object.rules[2].verbs == ['get', 'list', 'watch', 'create', 'update', 'patch'] && !has(object.rules[2].resourceNames) && !has(object.rules[2].nonResourceURLs) &&
          object.rules[3].apiGroups == ['apps'] && object.rules[3].resources == ['replicasets'] && object.rules[3].verbs == ['get', 'list', 'watch'] && !has(object.rules[3].resourceNames) && !has(object.rules[3].nonResourceURLs) &&
          object.rules[4].apiGroups == ['networking.k8s.io'] && object.rules[4].resources == ['ingresses', 'networkpolicies'] && object.rules[4].verbs == ['get', 'list', 'watch', 'create', 'update', 'patch'] && !has(object.rules[4].resourceNames) && !has(object.rules[4].nonResourceURLs) &&
          object.rules[5].apiGroups == ['policy'] && object.rules[5].resources == ['poddisruptionbudgets'] && object.rules[5].verbs == ['get', 'list', 'watch', 'create', 'update', 'patch'] && !has(object.rules[5].resourceNames) && !has(object.rules[5].nonResourceURLs) &&
          object.rules[6].apiGroups == [''] && object.rules[6].resources == ['configmaps'] && object.rules[6].resourceNames == ['smartrouter-staging-runtime-attestation'] && object.rules[6].verbs == ['get'] && !has(object.rules[6].nonResourceURLs)) ||
         (request.resource.resource == 'rolebindings' &&
          object.metadata.name == 'genai-smart-router-eks-staging-delivery' &&
          object.metadata.labels == {
            'app.kubernetes.io/name': 'smart-llmrouter',
            'app.kubernetes.io/component': 'delivery-identity'
          } &&
          object.subjects.size() == 1 &&
          object.subjects[0].apiGroup == 'rbac.authorization.k8s.io' &&
          object.subjects[0].kind == 'Group' &&
          object.subjects[0].name == 'genai-smart-router-eks-staging-delivery' &&
          object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
          object.roleRef.kind == 'Role' &&
          object.roleRef.name == 'genai-smart-router-eks-staging-delivery'))
      message: The bootstrap role may reconcile only the exact reviewed staging delivery RBAC objects.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: genai-smart-router-eks-staging-bootstrap-rbac
spec:
  policyName: genai-smart-router-eks-staging-bootstrap-rbac
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: smart-llmrouter-staging
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "rolebindings"]
        scope: Namespaced
