# Apply once in the approved tenant namespace before read-only discovery.
# Replace the namespace and Kubernetes group with the values configured on the
# EKS access entry. Do not use the IAM principal ARN as an RBAC subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genai-smart-router-eks-discovery
  namespace: replace-with-approved-tenant-namespace
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genai-smart-router-eks-discovery
  namespace: replace-with-approved-tenant-namespace
subjects:
  - kind: Group
    name: replace-with-approved-eks-access-entry-kubernetes-group
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: genai-smart-router-eks-discovery
