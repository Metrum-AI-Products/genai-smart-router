# Render this template only through `make eks-render-ingress-network-policy`
# after successful discovery. The base NetworkPolicy denies ingress until this
# selected-namespace allow policy is reviewed and applied. In Linkerd mode,
# `make eks-render-linkerd-policy` renders this companion policy first and
# requires verified ingress and router mesh-readiness evidence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-llmrouter-discovered-ingress
  namespace: __TENANT_NAMESPACE__
  labels:
    app.kubernetes.io/name: smart-llmrouter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-llmrouter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __INGRESS_NAMESPACE__
      ports:
        - protocol: TCP
          port: 8080
