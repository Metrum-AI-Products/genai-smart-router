# Render this template only through `make eks-render-ingress-network-policy`
# after successful discovery. An EKS deployment first adds the reviewed
# `tenant-router-ingress-guard.example.yaml`; this selected-namespace allow
# policy is then the only ingress exception. The generic base stays
# ingress-neutral for non-EKS deployments. In Linkerd mode,
# `make eks-render-linkerd-policy` renders this companion policy first and
# requires verified ingress identity, durable router injection, and router mesh
# evidence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-llmrouter-discovered-ingress
  namespace: __TENANT_NAMESPACE__
  labels:
    app.kubernetes.io/name: smart-llmrouter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-llmrouter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __INGRESS_NAMESPACE__
      ports:
        - protocol: TCP
          port: 8080
