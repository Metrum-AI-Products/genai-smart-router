# Separate read-only discovery identity; never bind this to tenant provisioning.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: genai-smart-router-eks-discovery
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: genai-smart-router-eks-discovery
subjects:
  # Use the Kubernetes username or group configured on the EKS access entry;
  # do not substitute the IAM principal ARN (RBAC never sees that ARN).
  - kind: Group
    name: replace-with-approved-eks-access-entry-kubernetes-group
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: genai-smart-router-eks-discovery
