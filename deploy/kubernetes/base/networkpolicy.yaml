apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-llmrouter-restrict
  labels:
    app.kubernetes.io/name: smart-llmrouter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-llmrouter
  policyTypes:
    - Ingress
    - Egress
  # Ingress is denied until the reviewed discovery-derived policy is rendered
  # for the selected ingress namespace. Do not restore a fixed namespace here.
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
