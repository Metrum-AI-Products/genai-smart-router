apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrum-ai-router-restrict
  labels:
    app.kubernetes.io/name: metrum-ai-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrum-ai-router
  policyTypes:
    - Egress
  # This generic base stays ingress-neutral so it remains usable outside EKS.
  # EKS overlays add the reviewed deny-ingress guard before selected discovery
  # renders and activates their companion allow policy.
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
