apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrum-ai-router
  labels:
    app.kubernetes.io/name: metrum-ai-router
  annotations:
    cert-manager.io/cluster-issuer: replace-with-cluster-issuer
spec:
  tls:
    - hosts:
        - llm-api.example.com
      secretName: metrum-ai-router-tls
  rules:
    - host: llm-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metrum-ai-router
                port:
                  name: http
