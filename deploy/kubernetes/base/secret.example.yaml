apiVersion: v1
kind: Secret
metadata:
  name: smart-llmrouter-secrets
  labels:
    app.kubernetes.io/name: smart-llmrouter
type: Opaque
stringData:
  ROUTER_USAGE_DB_DSN: postgres://llmrouter:replace-with-password@postgres.example.internal:5432/llmrouter?sslmode=require
  env.json: |
    {
      "OPENAI_API_KEY": "",
      "OPENROUTER_API_KEY": ""
    }
  license.json: |
    {
      "replace": "with Metrum-issued signed license JSON"
    }
