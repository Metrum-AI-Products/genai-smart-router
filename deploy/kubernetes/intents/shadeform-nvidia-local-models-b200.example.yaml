schema: metrum.ai/smartrouter-stack-intent/v1
profile: nvidia-local-serving
# B200/H200 matrix: one Qwen3.8-class 20–40B primary plus two <=9B models.
# Set hardware_profile to h200 when that is the selected Shadeform SKU.
hardware_profile: b200
namespace: smart-llmrouter
router_image: registry.example.com/metrum-router:<version>-linux-amd64
edge: ingress
usage_driver: sqlite
default_model_group: local-small-chat
gpu_operator:
  enabled: true
  version: v26.7.0
  # Shadeform's selected CUDA image already owns the NVIDIA driver and toolkit.
  driver_owned_by_ami: true
kv_cache:
  enabled: false
packaging:
  helm: true
  operator: true
serving_models:
  - name: vllm-primary
    served_model_id: local-qwen38
    huggingface_id: Qwen/Qwen3.8-27B
    image: vllm/vllm-openai:v0.11.0
    gpu_count: 1
    port: 8000
    max_model_len: 8192
    model_group: local-qwen38
    model_size_billions: 27
    api_key_env: LOCAL_VLLM_API_KEY
  - name: vllm-chat
    served_model_id: local-small-chat
    huggingface_id: Qwen/Qwen3.5-4B
    image: vllm/vllm-openai:v0.11.0
    gpu_count: 1
    port: 8000
    max_model_len: 8192
    model_group: local-small-chat
    model_size_billions: 4
    api_key_env: LOCAL_VLLM_API_KEY
  - name: vllm-coder
    served_model_id: local-small-coder
    huggingface_id: Qwen/Qwen3-8B
    image: vllm/vllm-openai:v0.11.0
    gpu_count: 1
    port: 8000
    max_model_len: 8192
    model_group: local-small-coder
    model_size_billions: 8
    api_key_env: LOCAL_VLLM_API_KEY
caller_allow:
  - local-qwen38
  - local-small-chat
  - local-small-coder
