AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege non-production delivery identity for the reviewed Smart Router EKS staging target.

Parameters:
  AuthorizedOperatorRoleArn:
    Type: String
    Description: Exact federated or SSO operator role authorized to assume the staging delivery role.
    AllowedPattern: ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
  ClusterName:
    Type: String
    Default: metrum
    AllowedPattern: ^metrum$

Resources:
  StagingDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: genai-smart-router-eks-staging-delivery
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuthorizedFederatedOperatorRole
            Effect: Allow
            Principal:
              AWS: !Ref AuthorizedOperatorRoleArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeApprovedCluster
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Sid: ReadReviewedStagingTarget
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metrum/genai-smart-router/staging-delivery-target
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-delivery
        - Key: environment
          Value: non-production

  # The authorized operator role must separately allow sts:AssumeRole on
  # StagingDeliveryRole. Keep that permission in its reviewed federation/SSO
  # assignment rather than mutating an arbitrary human identity from this stack.

  ProtectedStagingTarget:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /metrum/genai-smart-router/staging-delivery-target
      Type: String
      Tier: Standard
      Description: Reviewed non-secret Smart Router EKS staging delivery target policy.
      Value: !Sub |
        {
          "aws_account_id": "${AWS::AccountId}",
          "aws_region": "${AWS::Region}",
          "container_name": "router",
          "delivery_role_name": "genai-smart-router-eks-staging-delivery",
          "deployment_name": "smart-llmrouter",
          "ecr_repository_uri": "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/smart-llmrouter",
          "environment": "staging",
          "eks_cluster": "metrum",
          "image_architecture": "linux/amd64",
          "k8s_namespace": "smart-llmrouter-staging",
          "kustomize_overlay": "deploy/kubernetes/overlays/metrum-staging",
          "kustomize_router_image_name": "registry.example.com/smart-llmrouter",
          "runtime_secret_name": "smartrouter-staging-runtime",
          "runtime_secret_attestation_configmap_name": "smartrouter-staging-runtime-attestation",
          "schema_version": 6,
          "ssm_parameter_arn": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metrum/genai-smart-router/staging-delivery-target"
        }
      Tags:
        application: genai-smart-router
        purpose: eks-staging-delivery-target
        environment: non-production

  StagingDeliveryAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt StagingDeliveryRole.Arn
      Type: STANDARD
      KubernetesGroups:
        - genai-smart-router-eks-staging-delivery
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-delivery
        - Key: environment
          Value: non-production

Outputs:
  DeliveryRoleArn:
    Value: !GetAtt StagingDeliveryRole.Arn
  ProtectedTargetParameterName:
    Value: !Ref ProtectedStagingTarget
