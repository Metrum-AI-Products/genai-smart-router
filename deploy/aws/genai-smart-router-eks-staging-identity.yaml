AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege non-production delivery identity for the reviewed Smart Router EKS staging target.

Parameters:
  AuthorizedOperatorRoleArn:
    Type: String
    Description: Exact federated or SSO operator role authorized to assume the staging delivery role.
    AllowedPattern: ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
  ClusterName:
    Type: String
    Default: metrum
    AllowedPattern: ^metrum$

Resources:
  # The fixed IAM group is a permanent membership boundary. A platform owner
  # manages users and their required /smart-router-lifecycle/ IAM path outside
  # this stack; no individual identity appears in this template.
  # Fixed role names are rendered as ARNs below so target-role trust and
  # lifecycle delegation do not create a CloudFormation dependency cycle.
  LifecycleOperatorGroup:
    DependsOn: StagingLifecycleOperatorRole
    Type: AWS::IAM::Group
    Properties:
      GroupName: genai-smart-router-eks-staging-lifecycle-operators
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingLifecycleOperatorEntry
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EnterStagingLifecycleOperatorOnly
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-lifecycle-operator

  StagingLifecycleOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: genai-smart-router-eks-staging-lifecycle-operator
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuthorizedFederatedOperatorRole
            Effect: Allow
            Principal:
              AWS: !Ref AuthorizedOperatorRoleArn
            Action: sts:AssumeRole
          - Sid: DedicatedLifecycleIAMUsers
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/smart-router-lifecycle/*
              StringEquals:
                aws:PrincipalTag/GenAISmartRouterLifecycle: "true"
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingLifecycleDelegation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeReviewedStagingTargetRolesOnly
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-delivery
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-bootstrap
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-image-publisher
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-lifecycle-operator
        - Key: environment
          Value: non-production

  StagingDeliveryRole:
    DependsOn: StagingLifecycleOperatorRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: genai-smart-router-eks-staging-delivery
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuthorizedFederatedOperatorRole
            Effect: Allow
            Principal:
              AWS: !Ref AuthorizedOperatorRoleArn
            Action: sts:AssumeRole
          - Sid: PermanentLifecycleOperatorRole
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-lifecycle-operator
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeApprovedCluster
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Sid: ReadReviewedStagingTarget
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metrum/genai-smart-router/staging-delivery-target
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-delivery
        - Key: environment
          Value: non-production

  StagingBootstrapRole:
    DependsOn: StagingLifecycleOperatorRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: genai-smart-router-eks-staging-bootstrap
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuthorizedFederatedOperatorRole
            Effect: Allow
            Principal:
              AWS: !Ref AuthorizedOperatorRoleArn
            Action: sts:AssumeRole
          - Sid: PermanentLifecycleOperatorRole
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-lifecycle-operator
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingBootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeApprovedCluster
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-bootstrap
        - Key: environment
          Value: non-production

  # The authorized operator role must separately allow sts:AssumeRole on
  # StagingDeliveryRole. Keep that permission in its reviewed federation/SSO
  # assignment rather than mutating an arbitrary human identity from this stack.

  SmartRouterStagingImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: smart-llmrouter
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged image manifests after seven days.",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Retain the newest thirty immutable tagged images.",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["staging-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-image
        - Key: environment
          Value: non-production

  StagingImagePublisherRole:
    DependsOn: StagingLifecycleOperatorRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: genai-smart-router-eks-staging-image-publisher
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuthorizedFederatedOperatorRole
            Effect: Allow
            Principal:
              AWS: !Ref AuthorizedOperatorRoleArn
            Action: sts:AssumeRole
          - Sid: PermanentLifecycleOperatorRole
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/genai-smart-router-eks-staging-lifecycle-operator
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GenAISmartRouterEKSStagingImagePublisher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AuthenticateToECR
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushApprovedStagingRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt SmartRouterStagingImageRepository.Arn
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-image-publisher
        - Key: environment
          Value: non-production

  ProtectedStagingTarget:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /metrum/genai-smart-router/staging-delivery-target
      Type: String
      Tier: Standard
      Description: Reviewed non-secret Smart Router EKS staging delivery target policy.
      Value: !Sub |
        {
          "aws_account_id": "${AWS::AccountId}",
          "aws_region": "${AWS::Region}",
          "container_name": "router",
          "delivery_role_name": "genai-smart-router-eks-staging-delivery",
          "deployment_name": "smart-llmrouter",
          "ecr_repository_uri": "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/smart-llmrouter",
          "environment": "staging",
          "eks_cluster": "metrum",
          "image_architecture": "linux/amd64",
          "k8s_namespace": "smart-llmrouter-staging",
          "kustomize_overlay": "deploy/kubernetes/overlays/metrum-staging",
          "kustomize_router_image_name": "registry.example.com/smart-llmrouter",
          "runtime_secret_name": "smartrouter-staging-runtime",
          "runtime_secret_attestation_configmap_name": "smartrouter-staging-runtime-attestation",
          "schema_version": 6,
          "ssm_parameter_arn": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metrum/genai-smart-router/staging-delivery-target"
        }
      Tags:
        application: genai-smart-router
        purpose: eks-staging-delivery-target
        environment: non-production

  StagingDeliveryAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt StagingDeliveryRole.Arn
      Type: STANDARD
      KubernetesGroups:
        - genai-smart-router-eks-staging-delivery
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-delivery
        - Key: environment
          Value: non-production

  StagingBootstrapAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt StagingBootstrapRole.Arn
      Type: STANDARD
      KubernetesGroups:
        - genai-smart-router-eks-staging-bootstrap
      Tags:
        - Key: application
          Value: genai-smart-router
        - Key: purpose
          Value: eks-staging-bootstrap
        - Key: environment
          Value: non-production

Outputs:
  LifecycleOperatorRoleArn:
    Value: !GetAtt StagingLifecycleOperatorRole.Arn
  LifecycleOperatorGroupName:
    Value: !Ref LifecycleOperatorGroup
  DeliveryRoleArn:
    Value: !GetAtt StagingDeliveryRole.Arn
  BootstrapRoleArn:
    Value: !GetAtt StagingBootstrapRole.Arn
  StagingImagePublisherRoleArn:
    Value: !GetAtt StagingImagePublisherRole.Arn
  StagingImageRepositoryUri:
    Value: !GetAtt SmartRouterStagingImageRepository.RepositoryUri
  ProtectedTargetParameterName:
    Value: !Ref ProtectedStagingTarget
