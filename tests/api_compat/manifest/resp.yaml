# OpenAI Responses catalog (issue #94 Wave 1) — native streaming + P0 contracts.
cases:
  - id: RESP-01
    priority: P0
    owner: api-compat
    component: openai-responses
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    inbound_route: /v1/responses
    outbound_dialect: openai-responses
    transport: unary
    disposition: native_supported
    assertions:
      - string input and item-array history reach upstream unchanged
      - instructions are preserved
      - tool-only output items are not assumed to be text messages
    evidence_paths:
      - tests/api_compat/tests/test_responses_shapes.py
    test_id: test_responses_string_and_item_array_shapes

