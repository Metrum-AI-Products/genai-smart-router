# HTTP auth, discovery, and official SDK surface (issue #94).
cases:
  - id: HTTP-01
    priority: P0
    owner: api-compat
    component: sdk-clients
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    sdk_client_version: "openai==1.109.1,anthropic==0.68.1"
    inbound_route: /v1/*
    outbound_dialect: mixed
    transport: unary
    disposition: native_supported
    assertions:
      - OpenAI Python SDK lists models and completes chat without custom parsers
      - Anthropic Python SDK completes messages unary against /anthropic
      - emitted paths and model groups reach the scripted upstream correctly
    evidence_paths:
      - tests/api_compat/tests/test_http_sdk.py
      - tests/api_compat/manifest/http.yaml
    test_id: test_openai_sdk_lists_models_and_chat_unary

  - id: HTTP-02
    priority: P0
    owner: api-compat
    component: auth
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    inbound_route: /v1/*
    transport: unary
    disposition: policy_rejection
    assertions:
      - missing caller credentials reject with SDK-visible 401
      - zero upstream calls on auth rejection
    evidence_paths:
      - tests/api_compat/tests/test_http_sdk.py
      - tests/api_compat/tests/test_http_smoke.py
    test_id: test_openai_sdk_missing_auth_rejects_with_zero_upstream

  - id: HTTP-03
    priority: P0
    owner: api-compat
    component: discovery
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    inbound_route: /v1/models
    transport: unary
    disposition: native_supported
    assertions:
      - OpenAI SDK models.list returns caller-filtered model groups
      - private upstream metadata stays hidden from the caller catalog
    evidence_paths:
      - tests/api_compat/tests/test_http_sdk.py
      - tests/api_compat/tests/test_http_smoke.py
    test_id: test_openai_sdk_lists_models_and_chat_unary

