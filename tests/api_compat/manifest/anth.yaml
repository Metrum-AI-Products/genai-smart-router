# Anthropic Messages catalog (issue #94 Wave 1).
cases:
  - id: ANTH-01
    priority: P0
    owner: api-compat
    component: anthropic
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    inbound_route: /anthropic/v1/messages
    outbound_dialect: anthropic
    transport: mixed
    disposition: native_supported
    assertions:
      - Claude-style turn-two preserves system blocks, text, thinking, signatures, tool_use/results, and cache_control
      - unary and streamed first turns both survive continuation via scripted upstream
    evidence_paths:
      - tests/api_compat/tests/test_anthropic_turn_two.py
      - tests/api_compat/manifest/anth.yaml
    test_id: test_anthropic_unary_turn_two_preserves_thinking_and_tools

